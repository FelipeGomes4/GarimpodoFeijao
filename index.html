<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garimpo do Feijão - Usados Selecionados</title>
  <style>
    /* PALETA EXTRAÍDA DA LOGO */
    :root {
      --verde-logo: #5d6b3d;    /* Verde do círculo e detalhes */
      --marrom-logo: #3e2723;   /* Marrom do texto "FEIJÃO" */
      --creme-fundo: #fcfaf2;   /* Tom palha suave para o fundo */
      --branco: #ffffff;
      --verde-claro: #e8f0d5;   /* Para badges e fundos leves */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--creme-fundo); 
      color: var(--marrom-logo);
    }

    /* HEADER E LOGO */
    .header { 
      background: var(--branco); 
      padding: 2rem 1rem; 
      text-align: center; 
      border-bottom: 4px solid var(--verde-logo);
    }
    .logo-container { 
      max-width: 280px; 
      margin: 0 auto; 
      cursor: pointer; 
      transition: transform 0.2s; 
    }
    .logo-container:active { transform: scale(0.95); }
    .logo-img { width: 100%; height: auto; border-radius: 50%; }

    /* MENU DE CATEGORIAS CENTRALIZADO */
    .nav-container {
      background: var(--marrom-logo);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    .nav-menu {
      display: flex;
      gap: 12px;
      list-style: none;
    }
    .cat-btn {
      background: transparent;
      color: var(--creme-fundo);
      border: 1px solid var(--verde-logo);
      padding: 0.6rem 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--verde-logo);
      color: var(--branco);
    }

    /* BARRA ADMIN */
    .admin-bar { 
      background: #222; 
      color: #fff; 
      padding: 0.6rem 1rem; 
      display: none; 
      justify-content: space-between; 
      align-items: center; 
    }
    .admin-bar.active { display: flex; }

    /* VITRINE */
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .items-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 2rem; 
    }

    .item-card { 
      background: var(--branco); 
      border-radius: 20px; 
      border: 1px solid #e0ddd5; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      box-shadow: 0 6px 12px rgba(0,0,0,0.05);
      transition: transform 0.3s ease;
    }
    .item-card:hover { transform: translateY(-5px); }

    .item-img { height: 260px; background: #f0f0f0; position: relative; cursor: zoom-in; }
    .item-img img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-cond {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--verde-logo);
      color: white;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 10;
    }

    .item-info { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; text-align: center; }
    .item-title { font-size: 1.2rem; font-weight: 700; color: var(--marrom-logo); margin-bottom: 0.5rem; }
    .item-price { font-size: 1.5rem; font-weight: 800; color: var(--verde-logo); margin-bottom: 1.2rem; }
    
    .btn-wpp { 
      background: var(--verde-logo); 
      color: white; 
      text-decoration: none; 
      padding: 0.8rem; 
      border-radius: 12px; 
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }

    /* MODAIS */
    .modal-bg { 
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
      z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); 
    }
    .modal-bg.open { display: flex; }
    .modal { background: var(--branco); padding: 2rem; border-radius: 20px; width: 90%; max-width: 450px; }
    .modal input, .modal select, .modal textarea { 
      width: 100%; padding: 0.8rem; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; 
    }
    .btn-save { background: var(--marrom-logo); color: white; border: none; width: 100%; padding: 1rem; border-radius: 10px; font-weight: bold; cursor: pointer; }

    .photos-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
    .thumb-edit { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 2px solid #ddd; }

    #lightbox-img { max-width: 90%; max-height: 80vh; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: pointer; }

    .footer { text-align: center; padding: 3rem; color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container" onclick="handleLogoClick()">
      <img src="./Logo.png" alt="Garimpo do Feijão" class="logo-img">
    </div>
  </header>

  <div class="admin-bar" id="admin-bar">
    <span>Painel Administrativo</span>
    <div style="display:flex; gap:10px;">
      <button onclick="openAddModal()" style="padding:5px 15px; cursor:pointer;">+ Novo Produto</button>
      <button onclick="doLogout()" style="background:red; color:white; border:none; padding:5px 10px; cursor:pointer;">Sair</button>
    </div>
  </div>

  <nav class="nav-container">
    <div class="nav-menu">
      <button class="cat-btn active" onclick="filterItems('Todos')">Todos</button>
      <button class="cat-btn" onclick="filterItems('Eletrônicos')">Eletrônicos</button>
      <button class="cat-btn" onclick="filterItems('Casa')">Casa</button>
      <button class="cat-btn" onclick="filterItems('Vestuário')">Vestuário</button>
      <button class="cat-btn" onclick="filterItems('Outros')">Outros</button>
    </div>
  </nav>

  <main class="container">
    <div class="items-grid" id="items-grid"></div>
  </main>

  <div class="modal-bg" id="lightbox-modal" onclick="closeModals()">
    <img id="lightbox-img" src="" alt="Imagem ampliada">
    <p style="color: white; margin-top: 15px;">Clique na imagem para ver a próxima ou fora para fechar</p>
  </div>

  <div class="modal-bg" id="login-modal">
    <div class="modal">
      <h3 style="margin-bottom:15px">Acesso Restrito</h3>
      <input type="text" id="l-user" placeholder="Usuário">
      <input type="password" id="l-pass" placeholder="Senha">
      <button class="btn-save" onclick="doLogin()">Entrar</button>
      <button onclick="closeModals()" style="background:none; border:none; width:100%; margin-top:10px; color:gray; cursor:pointer;">Cancelar</button>
    </div>
  </div>

  <div class="modal-bg" id="item-modal">
    <div class="modal" style="max-height: 90vh; overflow-y: auto;">
      <h3 id="modal-title">Novo Tesouro</h3>
      <input type="text" id="f-name" placeholder="Nome do Produto">
      
      <!-- Campo de Preço com Máscara -->
      <input type="text" id="f-price" placeholder="Preço (Ex: R$ 50,00)" oninput="maskPrice(this)">
      
      <select id="f-cat">
        <option>Eletrônicos</option>
        <option>Casa</option>
        <option>Vestuário</option>
        <option>Outros</option>
      </select>
      
      <p style="font-size: 0.8rem; font-weight: bold;">Fotos do Produto:</p>
      <div id="photos-preview" class="photos-preview"></div>
      
      <input type="file" id="f-file" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
      <button onclick="document.getElementById('f-file').click()" style="width:100%; padding:0.8rem; cursor:pointer; border-radius:10px; border:1px dashed var(--marrom-logo); background: var(--verde-claro);">
        + Adicionar Foto do Dispositivo
      </button>

      <textarea id="f-desc" placeholder="Estado do produto..."></textarea>
      <button class="btn-save" onclick="saveItem()">Salvar no Garimpo</button>
      <button id="del-btn" onclick="deleteItem()" style="background:none; color:red; border:none; width:100%; margin-top:10px; cursor:pointer;">Excluir Produto</button>
      <button onclick="closeModals()" style="background:none; border:none; width:100%; margin-top:10px; color:gray; cursor:pointer;">Voltar</button>
    </div>
  </div>

<script>
  let items = JSON.parse(localStorage.getItem('garimpo_feijao_db')) || [];
  let isAdm = false;
  let editingId = null;
  let clickCount = 0;
  let currentFilter = 'Todos';
  let tempPhotos = [];

  // MÁSCARA DE DINHEIRO (BRL)[cite: 1]
  function maskPrice(input) {
    let value = input.value.replace(/\D/g, "");
    value = (value / 100).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL",
    });
    input.value = value;
  }

  function handleLogoClick() {
    clickCount++;
    setTimeout(() => clickCount = 0, 1000);
    if(clickCount === 3) document.getElementById('login-modal').classList.add('open');
  }

  function doLogin() {
    if(document.getElementById('l-user').value === 'feijao' && document.getElementById('l-pass').value === 'feijao123') {
      isAdm = true;
      document.getElementById('admin-bar').classList.add('active');
      closeModals(); render();
    } else { alert('Acesso negado'); }
  }

  function doLogout() { isAdm = false; document.getElementById('admin-bar').classList.remove('active'); render(); }

  function filterItems(cat) {
    currentFilter = cat;
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.innerText === cat));
    render();
  }

  function sendWppMessage(name, price) {
    const phone = "5521964190413";
    const text = `Olá! Vi no Garimpo do Feijão e tenho interesse no produto: *${name}* (${price}). Ainda está disponível?`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
  }

  function openLightbox(itemId) {
    const item = items.find(i => i.id === itemId);
    const photos = Array.isArray(item.img) ? item.img : [item.img];
    let idx = 0;
    
    const lbImg = document.getElementById('lightbox-img');
    lbImg.src = photos[0];
    document.getElementById('lightbox-modal').classList.add('open');
    
    lbImg.onclick = (e) => {
      e.stopPropagation();
      idx = (idx + 1) % photos.length;
      lbImg.src = photos[idx];
    };
  }

  function render() {
    const grid = document.getElementById('items-grid');
    grid.innerHTML = '';
    const filtered = currentFilter === 'Todos' ? items : items.filter(i => i.cat === currentFilter);
    
    filtered.forEach(item => {
      const displayImg = Array.isArray(item.img) ? item.img[0] : item.img;
      grid.innerHTML += `
        <div class="item-card">
          <div class="item-img" onclick="openLightbox(${item.id})">
            <span class="badge-cond">${item.cat}</span>
            <img src="${displayImg}" onerror="this.src='https://via.placeholder.com/400?text=Sem+Foto'">
          </div>
          <div class="item-info">
            <h3 class="item-title">${item.name}</h3>
            <p class="item-price">${item.price}</p>
            <button onclick="sendWppMessage('${item.name}', '${item.price}')" class="btn-wpp">
               Eu quero!
            </button>
            ${isAdm ? `<button onclick="openEdit(${item.id})" style="margin-top:10px; cursor:pointer;">⚙️ Editar</button>` : ''}
          </div>
        </div>
      `;
    });
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        tempPhotos.push(e.target.result);
        updatePhotoPreview();
      };
      reader.readAsDataURL(file);
    }
  }

  function updatePhotoPreview() {
    const div = document.getElementById('photos-preview');
    div.innerHTML = tempPhotos.map((src, index) => `
      <div style="position:relative">
        <img src="${src}" class="thumb-edit">
        <button onclick="removePhoto(${index})" style="position:absolute; top:0; right:0; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer">X</button>
      </div>
    `).join('');
  }

  function removePhoto(index) {
    tempPhotos.splice(index, 1);
    updatePhotoPreview();
  }

  function openAddModal() {
    editingId = null;
    tempPhotos = [];
    document.getElementById('modal-title').innerText = "Novo Tesouro";
    document.getElementById('f-name').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-desc').value = '';
    updatePhotoPreview();
    document.getElementById('del-btn').style.display = 'none';
    document.getElementById('item-modal').classList.add('open');
  }

  function openEdit(id) {
    editingId = id;
    const item = items.find(i => i.id === id);
    tempPhotos = Array.isArray(item.img) ? [...item.img] : [item.img];
    document.getElementById('f-name').value = item.name;
    document.getElementById('f-price').value = item.price;
    document.getElementById('f-cat').value = item.cat;
    document.getElementById('f-desc').value = item.desc;
    updatePhotoPreview();
    document.getElementById('del-btn').style.display = 'block';
    document.getElementById('item-modal').classList.add('open');
  }

  function saveItem() {
    const data = {
      id: editingId || Date.now(),
      name: document.getElementById('f-name').value,
      price: document.getElementById('f-price').value,
      cat: document.getElementById('f-cat').value,
      img: tempPhotos.length > 0 ? tempPhotos : ['https://via.placeholder.com/400?text=Sem+Foto'],
      desc: document.getElementById('f-desc').value
    };
    if(editingId) {
      const idx = items.findIndex(i => i.id === editingId);
      items[idx] = data;
    } else { items.push(data); }
    localStorage.setItem('garimpo_feijao_db', JSON.stringify(items));
    closeModals(); render();
  }

  function deleteItem() {
    if(confirm('Remover do garimpo?')) {
      items = items.filter(i => i.id !== editingId);
      localStorage.setItem('garimpo_feijao_db', JSON.stringify(items));
      closeModals(); render();
    }
  }

  function closeModals() { 
    document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open'));
  }

  render();
</script>
</body>
</html>
